  #    command: "--cluster_name nats-cluster --cluster nats://0.0.0.0:6222 --routes=nats://nats-1:6222,nats://nats-2:6222 --server_name=nats-3 --http_port 8222 -js "
  #    networks:
  #      - integration-test

  app:
    build:
      context: ./../../
      dockerfile:  ./.ci/docker/Dockerfile
    restart: always
    healthcheck:
      test: echo $$(wget --server-response http://127.0.0.1:8222/varz 2>&1 | grep  '200 OK') | grep '200'  || exit 1
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      nats-1:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats-1:4222
      HTTP_ADDRESS: :80
    hostname: app
    networks:
      - integration-test

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    ports:
      - "8080:80"
    networks:
      - integration-test

  elasticsearch:
    image: elasticsearch:9.2.3
    environment:
      - discovery.type="single-node"
      #      - ELASTIC_PASSWORD="password"
      #      - KIBANA_PASSWORD1="password"
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xmx1g -Xms1g"
    hostname: "elasticsearch"
    ports:
      - "9200:9200"
    networks:
      - integration-test

  kibana:
    image: kibana:8.13.0
    depends_on:
      - elasticsearch
      - logstash
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      #      - ELASTICSEARCH_USERNAME1=kibana_system
      #      - ELASTICSEARCH_PASSWORD1=password
      - xpack.security.enabled=false
    hostname: "kibana"
    ports:
      - "5601:5601"
    networks:
      - integration-test

  logstash:
    image: logstash:8.13.0
    links:
      - elasticsearch
    volumes:
      - ./logstash.conf:/etc/logstash/logstash.conf
    command: logstash -f /etc/logstash/logstash.conf
    ports:
      - "12201:12201/udp"
      - "9600:9600"
    networks:
      - integration-test
    depends_on:
      - elasticsearch

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - --web.enable-remote-write-receiver
    networks:
      - "integration-test"
    ports:
      - "9090:9090"
    extra_hosts:
      - "app-local:host-gateway"
    volumes:
      - ws_prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  node-exporter:
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    # https://hub.docker.com/r/prom/node-exporter/tags
    image: prom/node-exporter:v1.2.0
    networks:
      - "integration-test"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ws_grafana:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - "integration-test"

  cadvisor:
    expose:
      - 8080
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    networks:
      - "integration-test"
    ports:
      - "18080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  nats-exporter-1:
    image: natsio/prometheus-nats-exporter:latest
    ports:
      - '7777:7777'
    command:
      ['-channelz', '-subz', '-connz', '-varz', '-jsz=all', 'http://nats-1:8222']
    networks:
      - "integration-test"
      - "integration-test-nats-1"

  nats-exporter-2:
    image: natsio/prometheus-nats-exporter:latest
    command:
      ['-channelz', '-subz', '-connz', '-varz', '-jsz=all', 'http://nats-2:8222']
    networks:
      - "integration-test"
      - "integration-test-nats-2"

  nats-exporter-3:
    image: natsio/prometheus-nats-exporter:latest
    command:
      ['-channelz', '-subz', '-connz', '-varz', '-jsz=all', 'http://nats-3:8222']
    networks:
      - "integration-test"
      - "integration-test-nats-3"

