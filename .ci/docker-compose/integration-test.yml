version: "3.9"

volumes:
  ws_prometheus:
  ws_grafana:

services:
  nats-1:
    image: nats:alpine
    healthcheck:
      test: echo $$(wget --server-response http://127.0.0.1:8222/varz 2>&1 | grep  '200 OK') | grep '200'  || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    hostname: nats-1
    ports:
      - "4222:4222"
    command: "--js --http_port 8222 --server_name nats-1"
    networks:
      - integration-test

