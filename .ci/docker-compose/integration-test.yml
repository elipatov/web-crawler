  app:
    build:
      context: ./../../
      dockerfile:  ./.ci/docker/Dockerfile
    restart: always
    healthcheck:
      test: curl --fail http://127.0.0.1:8088/healthz || exit 1
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      nats-1:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats-1:4222
      HTTP_ADDRESS: :80
    hostname: app
    networks:
      - integration-test

networks:
  integration-test:
    driver: bridge