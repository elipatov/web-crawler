version: "3.9"

services:
  nats-1:
    image: nats:alpine
    healthcheck:
      test: echo $$(wget --server-response http://127.0.0.1:8222/varz 2>&1 | grep  '200 OK') | grep '200'  || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    hostname: nats-1
    ports:
      - "4222:4222"
    command:
      - "--js"
      - "--server_name"
      - "natsapi"
    networks:
      - integration-test

